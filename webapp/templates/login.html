<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#34D399">
<title>Oson Transport — Kirish</title>
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;background:#f8fafc;padding:16px}
.card{background:#fff;padding:2rem 1.75rem;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.08);width:100%;max-width:380px}
h2{margin:0 0 1.25rem;text-align:center;color:#0f172a;font-size:1.3rem}
label{font-size:.8rem;color:#64748b;display:block;margin-bottom:.3rem;font-weight:500}
input{width:100%;padding:.8rem;border:1px solid #e2e8f0;border-radius:10px;margin-bottom:1rem;font-size:16px;-webkit-appearance:none}
input:focus{outline:none;border-color:#34D399;box-shadow:0 0 0 3px rgba(52,211,153,.18)}
button{width:100%;padding:.85rem;background:#34D399;color:#fff;border:none;border-radius:10px;cursor:pointer;font-size:1rem;font-weight:600}
button:hover{background:#059669}
.error{color:#ef4444;text-align:center;margin-bottom:1rem;font-size:.88rem;background:#fef2f2;padding:.6rem;border-radius:8px}
.logo{text-align:center;margin-bottom:1rem;font-size:1.4rem;font-weight:700;color:#34D399}
</style>
</head>
<body>
<div class="card">
  <div class="logo">Oson Transport</div>
  <h2>Kirish</h2>
  {% if error %}<p class="error">{{ error_message }}</p>{% endif %}
  <form method="post" action="/login">
    <label>Telefon raqam</label>
    <input type="tel" name="phone" placeholder="+998..." autocomplete="username" autofocus required>
    <label>Parol</label>
    <input type="password" name="password" autocomplete="current-password" required>
    <button type="submit">Kirish</button>
  </form>
</div>
</body>
</html>
